# Handoff directory for the Vault broker and the executor (storage_state). Copy to /etc/tmpfiles.d/vault-handoff.conf
# (root), replace VAULTUSER with the account that runs the Vault containers (its UID is the containers' HOST_UID),
# then: groupadd --system vault-handoff; usermod -aG vault-handoff <executor account>; systemd-tmpfiles --create.
# /run is cleared at every boot, so no handoff file outlives a reboot. One directory per environment.
# 2710: the group may enter the directory but not list it, so a reader must know the operation ID to open a file.
# The marker (.vault-handoff) tells the broker this is its handoff directory; without it nothing is written or
# removed. It is excluded from the age cleanup, and so is the broker's journal of undelivered final events
# (.vault-undelivered: operation IDs and reasons only). Age 1h is only a backstop for systemd-tmpfiles-clean (daily); the
# broker removes each file at release, TTL, revocation and restart.
#
# Type Path                                    Mode User      Group         Age
d      /run/vault-handoff                      0755 root      root          -
d      /run/vault-handoff/prod                 2710 VAULTUSER vault-handoff 1h
f      /run/vault-handoff/prod/.vault-handoff  0600 VAULTUSER vault-handoff -
x      /run/vault-handoff/prod/.vault-handoff
x      /run/vault-handoff/prod/.vault-undelivered
x      /run/vault-handoff/prod/.vault-undelivered.tmp
