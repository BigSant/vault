name: Vault checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  application:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.5'
          extensions: mbstring, pdo_sqlite, sodium, curl, dom, xml
          coverage: none
      - name: Install locked dependencies
        working-directory: app/public
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Syntax and application contracts
        run: |
          find app/public/app app/public/config app/public/routes app/public/tests app/public/database scripts tests -name '*.php' -print0 | xargs -0 -n1 php -l
          cd app/public && vendor/bin/phpunit
      - name: Backup authentication and client contracts
        run: |
          php tests/crypto.php
          python3 -m compileall -q bin/vault broker clients scripts tests
          python3 -m unittest discover -s tests -p 'test_*.py' -v
