services:
  broker:
    environment:
      VAULT_TEST_FIXTURES: "1"
  egress:
    environment:
      VAULT_TEST_FIXTURES: "1"
  php-fpm-base:
    container_name: ${PROJECT_NAME}-${ENV}-php-fpm-base
  fixture:
    image: ${PROJECT_NAME}-broker:1
    container_name: ${PROJECT_NAME}-${ENV}-fixture
    command: ["python3", "/fixtures/target.py"]
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    volumes:
      - ${PROJECT_DOCKER_DIRECTORY}/../tests/fixtures/:/fixtures/:ro
    networks: [vault_egress]
